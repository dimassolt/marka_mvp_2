<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="ghost" d="M256 48 C352 48 424 120 424 224 L424 398 C424 440 390 456 362 434 C338 416 318 420 302 444
 C288 464 272 472 256 472 C240 472 224 464 210 444 C194 420 174 416 150 434 C122 456 88 440 88 398
 L88 224 C88 120 160 48 256 48 Z"/>
    <clipPath id="clip"><use href="#ghost"/></clipPath>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F6"/>
    </linearGradient>
    <radialGradient id="depth" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0.55" stop-color="#6E7788" stop-opacity="0"/>
      <stop offset="1" stop-color="#5E6779" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1E2330" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- glass body -->
  <use href="#ghost" fill="url(#body)" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <!-- curved top gloss, like light bending over the dome -->
    <path d="M120 210 C120 128 180 74 256 74 C332 74 392 128 392 210 C340 176 172 176 120 210 Z" fill="url(#gloss)" opacity="1"/>
  </g>
  <!-- black border -->
  <use href="#ghost" fill="none" stroke="#0A0B0F" stroke-width="14" stroke-linejoin="round"/>
  <!-- eyes -->
  <ellipse cx="200" cy="228" rx="24" ry="34" fill="#0A0B0F"/>
  <ellipse cx="312" cy="228" rx="24" ry="34" fill="#0A0B0F"/>
</svg>
