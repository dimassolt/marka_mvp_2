[project]
name = "ghost-engine"
version = "0.1.0"
description = "Local detection engine for Ghost Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fast-gliner>=0.4.1",
    "fastapi>=0.115",
    "huggingface-hub>=0.36",
    "llama-cpp-python>=0.3.36",
    "uvicorn>=0.32",
]

[project.scripts]
ghost-engine = "ghost_engine.main:run"

[tool.uv]
# How llama.cpp is built from source:
# - GGML_NATIVE=OFF: no -mcpu=native. Apple clang on newer Macs (M5) rejects it. Inference runs
#   on Metal, so the CPU flags barely matter. On x86 (Windows) AVX/AVX2 stay on.
# - LLAMA_OPENSSL=OFF: no HTTPS in llama.cpp's own model downloader, which we never use
#   (ADR-0001). It also stops the build linking a wrong-architecture OpenSSL from Homebrew.
extra-build-variables = { llama-cpp-python = { CMAKE_ARGS = "-DGGML_NATIVE=OFF -DLLAMA_OPENSSL=OFF" } }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gliner: loads the real GLiNER model (run scripts/fetch_gliner.py first)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Norwegian text and en dashes are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# fast_gliner and llama_cpp are typed through ports (EntityModel, ChatModel).
module = ["fast_gliner", "fast_gliner.*", "llama_cpp", "llama_cpp.*"]
ignore_missing_imports = true
