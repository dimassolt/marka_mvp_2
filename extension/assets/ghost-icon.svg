<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Frosted glass body: opaque, neutral white → cool silver -->
    <linearGradient id="body" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F1F3F6"/>
      <stop offset="1" stop-color="#C9CED7"/>
    </linearGradient>
    <!-- Inner edge shading for volume -->
    <radialGradient id="edge" cx="0.45" cy="0.38" r="0.68">
      <stop offset="0.62" stop-color="#8A93A3" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A8394" stop-opacity="0.45"/>
    </radialGradient>
    <!-- Rim light stroke -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Specular highlight -->
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Lenses: deep graphite glass -->
    <linearGradient id="lens" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3B404B"/>
      <stop offset="0.55" stop-color="#161920"/>
      <stop offset="1" stop-color="#0A0B0F"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E37"/>
      <stop offset="1" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2B3140" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="lensShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A1E28" flood-opacity="0.35"/>
    </filter>

    <path id="ghost" d="M256 48
      C352 48 424 120 424 224
      L424 398
      C424 440 390 456 362 434
      C338 416 318 420 302 444
      C288 464 272 472 256 472
      C240 472 224 464 210 444
      C194 420 174 416 150 434
      C122 456 88 440 88 398
      L88 224
      C88 120 160 48 256 48 Z"/>
    <clipPath id="ghostClip"><use href="#ghost"/></clipPath>

    <path id="lensL" d="M134 200 C134 188 142 182 154 182 L236 182 C248 182 254 190 252 202
      L246 238 C240 268 220 282 192 282 C162 282 142 266 138 238 Z"/>
    <path id="lensR" d="M378 200 C378 188 370 182 358 182 L276 182 C264 182 258 190 260 202
      L266 238 C272 268 292 282 320 282 C350 282 370 266 374 238 Z"/>
  </defs>

  <!-- Body -->
  <g filter="url(#shadow)">
    <use href="#ghost" fill="url(#body)"/>
  </g>
  <g clip-path="url(#ghostClip)">
    <use href="#ghost" fill="url(#edge)"/>
    <!-- bottom bounce light -->
    <ellipse cx="256" cy="470" rx="150" ry="40" fill="#FFFFFF" opacity="0.35" filter="url(#soft)"/>
    <!-- big top-right specular -->
    <ellipse cx="338" cy="104" rx="52" ry="26" transform="rotate(32 338 104)" fill="url(#spec)" opacity="0.95"/>
    <!-- left soft sheen -->
    <path d="M118 220 C118 150 160 96 222 78" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.7" filter="url(#soft)"/>
  </g>
  <use href="#ghost" fill="none" stroke="#A9B0BC" stroke-width="7"/>
  <use href="#ghost" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- Sunglasses -->
  <g filter="url(#lensShadow)">
    <!-- brow bar -->
    <path d="M126 192 C126 180 136 172 150 172 L362 172 C376 172 386 180 386 192"
          fill="none" stroke="url(#frame)" stroke-width="16" stroke-linecap="round"/>
    <!-- bridge -->
    <path d="M248 196 C252 186 260 186 264 196" fill="none" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
    <use href="#lensL" fill="url(#lens)" stroke="url(#frame)" stroke-width="10" stroke-linejoin="round"/>
    <use href="#lensR" fill="url(#lens)" stroke="url(#frame)" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <!-- lens reflections -->
  <clipPath id="clipL"><use href="#lensL"/></clipPath>
  <clipPath id="clipR"><use href="#lensR"/></clipPath>
  <g clip-path="url(#clipL)">
    <path d="M150 186 L196 186 L150 252 Z" fill="url(#glint)" opacity="0.55"/>
    <path d="M208 186 L222 186 L170 262 L160 252 Z" fill="#FFFFFF" opacity="0.18"/>
  </g>
  <g clip-path="url(#clipR)">
    <path d="M276 186 L322 186 L276 252 Z" fill="url(#glint)" opacity="0.55"/>
    <path d="M334 186 L348 186 L296 262 L286 252 Z" fill="#FFFFFF" opacity="0.18"/>
  </g>
  <!-- frame top highlight -->
  <path d="M150 168 L362 168" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
</svg>
